services:
  - type: web
    name: studentid-insight-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FACULTY_USERNAME
        value: faculty
      - key: FACULTY_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
